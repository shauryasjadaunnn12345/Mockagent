name: Bug report
description: Report a reproducible problem in MockAgent.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues for a similar report.
        **Do not include API keys, passwords, private user data, or unredacted logs.**
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A concise description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence of actions or requests that reproduces it.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MockAgent version or commit
      description: Include the deployed version or local commit if known.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example, hosted app or self-hosted; browser/OS; Node.js version if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal or production data before sharing.
      render: text
